<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福利放送</title>
    <style>
        body { margin: 0; background-color: #1a1a1a; color: #fff; font-family: 'Microsoft YaHei', sans-serif; text-align: center; }
        
        #age-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; padding: 20px; box-sizing: border-box;
        }
        #age-gate h1 { color: #ff4757; font-size: 36px; text-shadow: 2px 2px 4px #000; margin-bottom: 10px;}
        #age-gate p { color: #aaa; font-size: 18px; margin-bottom: 30px;}
        
        .btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.3s;}
        #btn-yes { background: #ff4757; color: #fff; box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);}
        #btn-yes:hover { background: #ff6b81; }
        #btn-no { background: #333; color: #aaa;}
        #btn-no:hover { background: #444; color: #fff;}
        
        #main-content {
            display: none; padding-top: 50px;
        }
        #main-content h1 {
            font-size: 36px; color: #ff4757; text-shadow: 2px 2px 4px #000;
        }
        
        .video-container {
            width: 80%; max-width: 800px; margin: 0 auto;
            border: 3px solid #ff4757; box-shadow: 0 0 20px rgba(255, 71, 87, 0.5); border-radius: 10px;
            overflow: hidden;
        }
        iframe { width: 100%; height: 450px; border: none; display: block;}
    </style>
</head>
<body>

    <!-- 第一层：年龄验证 -->
    <div id="age-gate">
        <h1>⚠️ 警告 ⚠️</h1>
        <p>本网站内含成人向内容。<br>请确认您是否已年满 18 周岁？</p >
        <div>
            <button class="btn" id="btn-yes" onclick="enterSite()">是，我已满 18 岁</button>
            <button class="btn" id="btn-no" onclick="denyEnter()">否</button>
        </div>
    </div>

    <!-- 第二层：鞭尸视频 -->
    <div id="main-content">
        <h1>🎁 福利放送 🎁</h1>
        <div class="video-container">
            <iframe src="//player.bilibili.com/player.html?bvid=BV1Aqw3eNELp&page=1&high_quality=1&danmaku=0&autoplay=0" scrolling="no" allowfullscreen="true"></iframe>
        </div>
    </div>

    <!-- 魔法 Javascript -->
    <script>
        function enterSite() {
            document.getElementById('age-gate').style.display = 'none'; // 隐藏警告层
            document.getElementById('main-content').style.display = 'block'; // 显示视频层
        }
        
        function denyEnter() {
            alert("未满18岁请自觉离开，再点也没用咪");
            document.getElementById('age-gate').innerHTML = "<h1>小朋友不可以看这个哦 😈</h1><p>请点击右上角关闭网页。</p >";
        }
    </script>

</body>
</html>
